<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VRMXT viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
        background: #1a1a1e;
        color: #eee;
      }
      #hud {
        position: absolute;
        left: 12px;
        top: 12px;
        z-index: 1;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      #status {
        font-size: 13px;
        opacity: 0.9;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      button,
      label {
        background: #333;
        color: #eee;
        border: 0;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <label>
        Open VRM…
        <input id="file" type="file" accept=".vrm,.glb,.gltf" hidden />
      </label>
      <span id="status">Drop a .vrm here or open a file. View only.</span>
    </div>
    <canvas id="view"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
